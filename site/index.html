<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080f1d" media="(prefers-color-scheme: dark)">
<title>Convoy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M7 22c5 0 4-9 9-9s4 7 9 7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='22' r='2.6' fill='%23fff'/%3E%3Ccircle cx='25' cy='20' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/site.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
         background: radial-gradient(900px 480px at 85% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
                     radial-gradient(700px 420px at -10% 10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%),
                     var(--bg); }
  .top { max-width: 720px; width: 100%; margin: 0 auto; padding: 18px 20px; }
  main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 20px 20px 48px; display: flex; flex-direction: column;
         justify-content: center; }
  h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.06; letter-spacing: -.03em; font-weight: 800; }
  h1 em { font-style: normal; color: var(--link); }
  .lede { color: var(--muted); font-size: 17px; line-height: 1.55; margin: 18px 0 26px; max-width: 34em; }
  .lede + .lede { margin-top: -10px; }
  @media (max-width: 600px) { .lede { font-size: 16px; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M7 22c5 0 4-9 9-9s4 7 9 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="7" cy="22" r="2.6" fill="#fff"/><circle cx="25" cy="20" r="2.6" fill="#fff"/></svg>
    Convoy
  </span>
</header>

<main>
  <h1>Drive together, <em>stay together.</em></h1>
  <p class="lede">This is a Convoy relay. Cars driving together see each other on a live map and send each other messages and voice notes through it.</p>
  <p class="lede">To follow a convoy, open the link its driver shared with you, or scan its QR code.</p>
  <p><a class="btn big" href="https://dash.coldshift.racing/convoy/">About Convoy</a></p>
</main>
</body>
</html>
